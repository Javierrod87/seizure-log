<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Seizure Log">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Seizure Log</title>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --card2:#273449; --line:#334155;
    --text:#f1f5f9; --muted:#94a3b8; --accent:#38bdf8; --accent2:#0ea5e9;
    --danger:#f87171; --ok:#4ade80; --warn:#fbbf24;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  body{padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px)}
  .wrap{max-width:560px;margin:0 auto;padding:16px}
  header{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
  header h1{font-size:20px;margin:0}
  header .who{font-size:13px;color:var(--muted);text-align:right}
  .sync{font-size:12px;color:var(--muted)}
  .sync.pending{color:var(--warn)}
  .card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px}
  .card h2{font-size:14px;font-weight:600;color:var(--muted);margin:0 0 12px;text-transform:uppercase;letter-spacing:.04em}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
  .stat .n{font-size:28px;font-weight:700}
  .stat.today .n{font-size:40px;color:var(--accent)}
  .stat .l{font-size:12px;color:var(--muted)}
  .bytype{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .pill{background:var(--card2);border-radius:999px;padding:4px 10px;font-size:13px}
  .types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .types button{min-height:64px;font-size:16px;font-weight:600}
  button{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);
    border-radius:12px;padding:12px 14px;cursor:pointer}
  button:active{transform:scale(.98)}
  button.primary{background:var(--accent2);border-color:var(--accent2);color:#fff;font-weight:700}
  button.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
  button.link{background:none;border:none;color:var(--accent);padding:6px}
  .chart{display:flex;align-items:flex-end;gap:4px;height:130px;padding-top:18px}
  .bar{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
  .bar .b{width:100%;background:var(--accent2);border-radius:4px 4px 0 0;min-height:2px}
  .bar .v{font-size:11px;color:var(--text);margin-bottom:2px}
  .bar .d{font-size:10px;color:var(--muted);margin-top:4px;white-space:nowrap;height:13px}
  .bar.zero .b{background:var(--line)}
  .rangebtns{display:flex;gap:6px;margin-bottom:4px}
  .rangebtns button{padding:6px 10px;font-size:13px;border-radius:8px}
  .rangebtns button.on{background:var(--accent2);border-color:var(--accent2)}
  .day{margin-top:14px}
  .day:first-child{margin-top:0}
  .dayhdr{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);
    border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:4px}
  .ev{display:flex;gap:10px;padding:10px 4px;border-bottom:1px solid #263244;align-items:flex-start}
  .ev:last-child{border-bottom:none}
  .ev .t{font-variant-numeric:tabular-nums;color:var(--muted);min-width:64px;font-size:14px}
  .ev .m{flex:1}
  .ev .ty{font-weight:600}
  .ev .sub{font-size:13px;color:var(--muted)}
  .ev .x{font-size:12px;color:var(--warn)}
  .ev .rx{color:var(--danger);font-weight:600}
  .empty{color:var(--muted);text-align:center;padding:12px}
  /* sheet */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:10}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:20px 20px 0 0;
    padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;
    transform:translateY(105%);transition:transform .2s ease,visibility .2s;visibility:hidden;z-index:11;max-width:560px;margin:0 auto}
  .sheet.open{transform:none;visibility:visible}
  .scrim.open{display:block}
  .sheet h3{margin:0 0 14px;font-size:18px}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
  input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--bg);
    border:1px solid var(--line);border-radius:10px;padding:12px}
  textarea{min-height:70px;resize:vertical}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chips button{padding:8px 12px;border-radius:999px;font-size:14px}
  .chips button.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  .stepper{display:flex;align-items:center;gap:10px}
  .stepper button{width:48px;height:48px;padding:0;font-size:22px}
  .stepper input{text-align:center;font-size:20px;font-weight:700}
  .check{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:16px;color:var(--text)}
  .check input{width:24px;height:24px}
  .actions{display:flex;gap:10px;margin-top:18px}
  .actions button{flex:1;min-height:52px}
  .err{color:var(--danger);font-size:14px;margin-top:10px;min-height:1em}
  .login{max-width:380px;margin:12vh auto 0}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:#020617;border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-size:14px;
    opacity:0;transition:opacity .2s;z-index:20;pointer-events:none}
  .toast.show{opacity:1}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
  .types button:first-child{grid-column:1/-1;min-height:84px;font-size:21px;
    background:var(--accent2);border-color:var(--accent2);color:#fff}
  #recChips button{flex:1;min-height:48px}
  .ev .rec-ok{color:var(--ok)} .ev .rec-bad{color:var(--warn)}
  .hidden{display:none!important}
  /* meds */
  .med{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #263244}
  .med:last-child{border-bottom:none}
  .med .nm{font-weight:700}
  .med .ds{color:var(--accent);font-weight:600}
  .med .since{font-size:12px;color:var(--muted)}
  .med .btns{display:flex;gap:6px;flex-shrink:0}
  .med .btns button{padding:8px 10px;font-size:13px;border-radius:8px}
  .wide{width:100%;min-height:56px;font-size:17px;font-weight:700}
  .mh-row{padding:10px 4px;border-bottom:1px solid #263244;cursor:pointer}
  .mh-row .sub{font-size:13px;color:var(--muted)}
  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--card2);margin-left:6px;vertical-align:middle}
  .tag.on{background:#14532d;color:#bbf7d0}
  /* report (light, printable) */
  #reportView{background:#fff;color:#111;min-height:100vh}
  #reportView .rtool{position:sticky;top:0;background:#0f172a;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:5}
  #reportView .rtool select,#reportView .rtool button{width:auto;padding:9px 12px;font-size:14px;border-radius:8px}
  #reportView .rtool .sp{flex:1}
  .rep{max-width:820px;margin:0 auto;padding:20px 16px 40px;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#111}
  .rep h1{font-size:22px;margin:0}
  .rep h2{font-size:15px;margin:26px 0 8px;padding-bottom:4px;border-bottom:2px solid #111;text-transform:uppercase;letter-spacing:.04em}
  .rep .meta{color:#555;font-size:13px;margin-top:2px}
  .rep table{width:100%;border-collapse:collapse;font-size:13px}
  .rep th,.rep td{text-align:left;padding:6px 6px;border-bottom:1px solid #ddd;vertical-align:top}
  .rep th{background:#f3f4f6;font-weight:700}
  .rep td.n,.rep th.n{text-align:right;font-variant-numeric:tabular-nums}
  .rep .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .rep .kpi{border:1px solid #ddd;border-radius:8px;padding:8px 10px}
  .rep .kpi .v{font-size:20px;font-weight:700}
  .rep .kpi .l{font-size:11px;color:#555;text-transform:uppercase;letter-spacing:.03em}
  .rep .note{font-size:12px;color:#555;margin-top:6px}
  .rep .daygrp td{background:#fafafa;font-weight:700}
  .rep svg text{font-family:inherit}
  @media (max-width:600px){ .rep .kpis{grid-template-columns:repeat(2,1fr)} }
  @media print{
    body{background:#fff!important;padding:0}
    #mainView,#loginView,.sheet,.scrim,.toast,.rtool{display:none!important}
    #reportView{display:block!important}
    .rep{max-width:none;padding:0}
    .rep h2{break-after:avoid}
    .rep tr,.rep .kpi{break-inside:avoid}
    @page{margin:14mm}
  }
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="loginView" class="wrap hidden">
  <div class="login card">
    <h1 id="liTitle" style="margin:0 0 4px;font-size:22px">Seizure Log</h1>
    <div class="sub" style="color:var(--muted);font-size:14px;margin-bottom:8px">Sign in once on each phone.</div>
    <label>Email</label>
    <input id="liEmail" type="email" autocomplete="username" inputmode="email">
    <label>Password</label>
    <input id="liPass" type="password" autocomplete="current-password">
    <label>Your name (shows on entries)</label>
    <input id="liName" type="text" placeholder="e.g. Javier">
    <div class="actions"><button class="primary" id="liBtn">Sign in</button></div>
    <div class="err" id="liErr"></div>
  </div>
</div>

<!-- ===================== MAIN ===================== -->
<div id="mainView" class="wrap hidden">
  <header>
    <h1 id="title">Seizure Log</h1>
    <div class="who"><div id="whoName"></div><div class="sync" id="syncState">—</div></div>
  </header>

  <div class="card">
    <h2>Today</h2>
    <div class="stats">
      <div class="stat today"><div class="n" id="sToday">0</div><div class="l">Today</div></div>
      <div class="stat"><div class="n" id="sYest">0</div><div class="l">Yesterday</div></div>
      <div class="stat"><div class="n" id="s7">0</div><div class="l">7-day avg</div></div>
      <div class="stat"><div class="n" id="s30">0</div><div class="l">30-day avg</div></div>
    </div>
    <div class="bytype" id="todayTypes"></div>
  </div>

  <div class="card">
    <h2>Log a seizure</h2>
    <div class="types" id="typeBtns"></div>
  </div>

  <div class="card">
    <h2>Current medications</h2>
    <div id="medList"></div>
    <div class="foot">
      <button class="link" id="addMedBtn">+ Add medication</button>
      <button class="link" id="medHistBtn">Medication history</button>
    </div>
  </div>

  <div class="card" style="padding:12px">
    <button class="primary wide" id="reportBtn">View report for doctor</button>
  </div>

  <div class="card">
    <h2>Daily totals</h2>
    <div class="rangebtns">
      <button data-range="7">7 days</button>
      <button data-range="14" class="on">14 days</button>
      <button data-range="30">30 days</button>
    </div>
    <div class="chart" id="chart"></div>
  </div>

  <div class="card">
    <h2>History</h2>
    <div id="history"></div>
    <div class="foot">
      <button class="link" id="moreBtn">Show more days</button>
      <button class="link" id="exportBtn">Export CSV</button>
    </div>
  </div>

  <div style="text-align:center"><button class="link" id="logoutBtn" style="color:var(--muted)">Sign out</button></div>
</div>

<!-- ===================== ENTRY SHEET ===================== -->
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <h3 id="shTitle">Log seizure</h3>
  <label>Type</label>
  <div class="chips" id="shTypes"></div>
  <label>When</label>
  <input id="shWhen" type="datetime-local">
  <label>How many (use for clusters)</label>
  <div class="stepper">
    <button id="cMinus" type="button">−</button>
    <input id="shCount" type="number" min="1" max="500" value="1" inputmode="numeric">
    <button id="cPlus" type="button">+</button>
  </div>
  <label>About how long (optional)</label>
  <div class="chips" id="durChips">
    <button type="button" data-s="5">5s</button><button type="button" data-s="10">10s</button>
    <button type="button" data-s="15">15s</button><button type="button" data-s="30">30s</button>
    <button type="button" data-s="60">1 min</button><button type="button" data-s="120">2 min</button>
  </div>
  <input id="shDur" type="number" min="0" inputmode="numeric" placeholder="Or type seconds" style="margin-top:10px">
  <label>Coming out of it</label>
  <div class="chips" id="recChips">
    <button type="button" data-r="Came right out">Came right out</button>
    <button type="button" data-r="Disoriented / confused">Disoriented / confused</button>
  </div>
  <label class="check"><input id="shRx" type="checkbox"> Rescue medication given</label>
  <label>Notes (optional)</label>
  <textarea id="shNotes" placeholder="Triggers, sleep, illness, what happened after…"></textarea>
  <div class="actions">
    <button id="shCancel" type="button">Cancel</button>
    <button id="shSave" class="primary" type="button">Save</button>
  </div>
  <div class="actions hidden" id="shDelRow"><button id="shDelete" class="danger" type="button">Delete entry</button></div>
  <div class="err" id="shErr"></div>
</div>

<!-- ===================== MED SHEET ===================== -->
<div class="sheet" id="medSheet">
  <h3 id="mdTitle">Add medication</h3>
  <div id="mdNameWrap">
    <label>Medication name</label>
    <input id="mdName" type="text" placeholder="e.g. Clobazam (Onfi)" autocomplete="off">
  </div>
  <div id="mdDoseWrap">
    <label>Dose</label>
    <input id="mdDose" type="text" placeholder="e.g. 10 mg">
    <label>How often</label>
    <div class="chips" id="mdFreqChips">
      <button type="button" data-f="Once daily">Once daily</button>
      <button type="button" data-f="Twice daily">Twice daily</button>
      <button type="button" data-f="Three times daily">3× daily</button>
      <button type="button" data-f="At bedtime">At bedtime</button>
      <button type="button" data-f="As needed (rescue)">As needed / rescue</button>
    </div>
    <input id="mdFreq" type="text" placeholder="Or type, e.g. 5 mg AM / 10 mg PM" style="margin-top:8px">
  </div>
  <label id="mdDateLbl">Date started</label>
  <input id="mdDate" type="date">
  <div id="mdEndWrap" class="hidden">
    <label>Date stopped (leave blank if still taking)</label>
    <input id="mdEnd" type="date">
  </div>
  <label id="mdReasonLbl">Reason / doctor's note (optional)</label>
  <input id="mdReason" type="text" placeholder="e.g. Dr. Smith increased — still breakthrough seizures">
  <div class="actions">
    <button id="mdCancel" type="button">Cancel</button>
    <button id="mdSave" class="primary" type="button">Save</button>
  </div>
  <div class="actions hidden" id="mdDelRow"><button id="mdDelete" class="danger" type="button">Delete this record</button></div>
  <div class="err" id="mdErr"></div>
</div>

<!-- ===================== MED HISTORY SHEET ===================== -->
<div class="sheet" id="mhSheet">
  <h3>Medication history</h3>
  <div class="sub" style="color:var(--muted);font-size:13px;margin-bottom:8px">Tap any line to correct it.</div>
  <div id="mhList"></div>
  <div class="actions"><button id="mhClose" type="button">Close</button></div>
</div>

<!-- ===================== REPORT ===================== -->
<div id="reportView" class="hidden">
  <div class="rtool">
    <button id="repBack" type="button">‹ Back</button>
    <select id="repRange">
      <option value="30">Last 30 days</option>
      <option value="90">Last 90 days</option>
      <option value="182">Last 6 months</option>
      <option value="365">Last 12 months</option>
      <option value="all" selected>All time</option>
    </select>
    <span class="sp"></span>
    <button id="repPrint" class="primary" type="button">Print / Save PDF</button>
  </div>
  <div class="rep" id="repBody"><div style="padding:40px;text-align:center;color:#555">Loading…</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   CONFIG — fill these in (see SETUP.md)
   ========================================================= */
const SUPABASE_URL      = 'https://dwgyjfvpfdlrndziprqx.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_hmdQEtsv_ma5Yd4eU6HuNg_9zKwSfH_';
const CHILD_NAME        = 'Kade';
const SEIZURE_TYPES = [
  'Tonic', 'Atonic (drop)', 'Atypical absence',
  'Tonic-clonic', 'Myoclonic', 'Other / unsure'
];
const HISTORY_DAYS_LOADED = 90;   // how far back the app pulls for charts/history
const POLL_MS = 30000;            // refresh from server every 30s while open

/* =========================================================
   Storage helpers
   ========================================================= */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
let session = LS.get('sl_session', null);   // {access_token, refresh_token, expires_at, email}
let myName  = LS.get('sl_name', '');
let outbox  = LS.get('sl_outbox', []);      // rows waiting to be saved to server
let events  = LS.get('sl_cache', []);       // last server copy (so the app opens instantly / offline)
let range   = 14;
let historyDays = 7;
let lastSync = null;
let meds    = LS.get('sl_meds', []);        // medication regimens

/* =========================================================
   Raw REST layer (no supabase-js)
   ========================================================= */
async function authReq(grant, body){
  const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=${grant}`, {
    method:'POST',
    headers:{ apikey:SUPABASE_ANON_KEY, 'Content-Type':'application/json' },
    body:JSON.stringify(body)
  });
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error_description || j.msg || j.message || ('Sign-in failed ('+r.status+')'));
  return {
    access_token:j.access_token, refresh_token:j.refresh_token,
    expires_at:j.expires_at || (Math.floor(Date.now()/1000) + (j.expires_in||3600)),
    email:(j.user && j.user.email) || (session && session.email) || ''
  };
}
let refreshing = null;
async function ensureToken(){
  if(!session) throw new Error('not signed in');
  if(session.expires_at - 60 > Date.now()/1000) return;
  if(!refreshing){
    refreshing = authReq('refresh_token', { refresh_token:session.refresh_token })
      .then(s => { session = s; LS.set('sl_session', s); })
      .catch(e => { if(/invalid|not found|revoked|expired/i.test(e.message)){ signOut(); } throw e; })
      .finally(() => { refreshing = null; });
  }
  return refreshing;
}
async function api(path, { method='GET', body, prefer } = {}){
  await ensureToken();
  const headers = {
    apikey:SUPABASE_ANON_KEY,
    Authorization:'Bearer ' + session.access_token,
    'Content-Type':'application/json'
  };
  if(prefer) headers.Prefer = prefer;
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    method, headers, body: body === undefined ? undefined : JSON.stringify(body)
  });
  if(r.status === 401){ session.expires_at = 0; LS.set('sl_session', session); }
  const txt = await r.text();
  if(!r.ok){
    let msg = txt; try{ const j = JSON.parse(txt); msg = j.message || j.hint || txt; }catch(e){}
    throw new Error(msg || ('Request failed ('+r.status+')'));
  }
  return txt ? JSON.parse(txt) : null;
}

/* =========================================================
   Data ops
   ========================================================= */
function uuid(){
  if(crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16);
  });
}
async function pull(){
  const since = new Date(Date.now() - HISTORY_DAYS_LOADED*864e5).toISOString();
  const rows = await api(`seizures?select=*&occurred_at=gte.${encodeURIComponent(since)}&order=occurred_at.desc&limit=10000`);
  events = rows || [];
  LS.set('sl_cache', events);
  try{
    meds = await api('medications?select=*&order=started_on.desc,created_at.desc') || [];
    LS.set('sl_meds', meds);
  }catch(e){ console.warn('meds load failed', e); }
  lastSync = new Date();
}
async function flushOutbox(){
  if(!outbox.length) return;
  const batch = outbox.slice();
  // upsert with ignore-duplicates on id → retries can never double-count
  await api('seizures?on_conflict=id', {
    method:'POST', body:batch, prefer:'resolution=ignore-duplicates,return=minimal'
  });
  const sent = new Set(batch.map(b => b.id));
  outbox = outbox.filter(o => !sent.has(o.id));
  LS.set('sl_outbox', outbox);
}
let syncing = false;
async function sync(){
  if(!session || syncing) return;
  syncing = true;
  try{
    await flushOutbox();
    await pull();
  }catch(e){
    console.warn('sync failed', e);
  }finally{
    syncing = false;
    render();
  }
}

/* =========================================================
   Date helpers (device local time)
   ========================================================= */
const pad = n => String(n).padStart(2,'0');
function dayKey(d){ d = new Date(d); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function localInputValue(d){
  d = new Date(d);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function fmtTime(d){ return new Date(d).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}); }
function fmtDay(key){
  const [y,m,dd] = key.split('-').map(Number);
  const d = new Date(y, m-1, dd);
  const t = dayKey(new Date()), yk = dayKey(addDays(new Date(), -1));
  if(key === t) return 'Today';
  if(key === yk) return 'Yesterday';
  return d.toLocaleDateString([], {weekday:'short', month:'short', day:'numeric'});
}
function fmtDur(sec){ if(sec==null) return ''; sec=+sec; return sec<60 ? sec+'s' : Math.floor(sec/60)+'m '+pad(sec%60)+'s'; }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* =========================================================
   Render
   ========================================================= */
function allRows(){
  const ids = new Set(events.map(e => e.id));
  const pending = outbox.filter(o => !ids.has(o.id)).map(o => ({...o, _pending:true}));
  return pending.concat(events).sort((a,b) => new Date(b.occurred_at) - new Date(a.occurred_at));
}
function totalsByDay(rows){
  const m = {};
  rows.forEach(r => { const k = dayKey(r.occurred_at); m[k] = (m[k]||0) + (r.seizure_count||1); });
  return m;
}
function avg(byDay, days){
  // average over the last N full days, not counting today
  let s = 0;
  for(let i=1;i<=days;i++) s += byDay[dayKey(addDays(new Date(), -i))] || 0;
  const v = s/days;
  return v >= 10 ? Math.round(v) : (Math.round(v*10)/10);
}
function render(){
  renderMeds();
  const rows = allRows();
  const byDay = totalsByDay(rows);
  const todayK = dayKey(new Date());
  document.getElementById('sToday').textContent = byDay[todayK] || 0;
  document.getElementById('sYest').textContent  = byDay[dayKey(addDays(new Date(),-1))] || 0;
  document.getElementById('s7').textContent  = avg(byDay, 7);
  document.getElementById('s30').textContent = avg(byDay, 30);

  // today by type
  const tt = {};
  rows.filter(r => dayKey(r.occurred_at) === todayK)
      .forEach(r => tt[r.seizure_type] = (tt[r.seizure_type]||0) + (r.seizure_count||1));
  const todays = rows.filter(r => dayKey(r.occurred_at) === todayK);
  const durs = todays.filter(r => r.duration_sec != null).map(r => +r.duration_sec);
  const confused = todays.filter(r => r.recovery && !/right/.test(r.recovery)).length;
  const okc = todays.filter(r => r.recovery && /right/.test(r.recovery)).length;
  const pills = Object.entries(tt).map(([k,v]) => `<span class="pill">${esc(k)}: <b>${v}</b></span>`);
  if(durs.length) pills.push(`<span class="pill">Avg length: <b>${fmtDur(Math.round(durs.reduce((a,b)=>a+b,0)/durs.length))}</b></span>`,
                             `<span class="pill">Longest: <b>${fmtDur(Math.max(...durs))}</b></span>`);
  if(okc) pills.push(`<span class="pill">Came right out: <b>${okc}</b></span>`);
  if(confused) pills.push(`<span class="pill">Disoriented: <b>${confused}</b></span>`);
  document.getElementById('todayTypes').innerHTML = pills.join('');

  // chart
  const days = [];
  for(let i=range-1;i>=0;i--) days.push(dayKey(addDays(new Date(), -i)));
  const max = Math.max(1, ...days.map(k => byDay[k]||0));
  document.getElementById('chart').innerHTML = days.map((k,i) => {
    const v = byDay[k]||0;
    const [y,m,d] = k.split('-').map(Number);
    const step = range <= 7 ? 1 : range <= 14 ? 2 : 5;
    const lbl = (days.length-1-i) % step === 0 || i === days.length-1
      ? new Date(y,m-1,d).toLocaleDateString([], range<=7 ? {weekday:'short'} : {month:'numeric', day:'numeric'}) : '';
    return `<div class="bar ${v?'':'zero'}"><div class="v">${v||''}</div>
      <div class="b" style="height:${(v/max)*100}%"></div><div class="d">${lbl}</div></div>`;
  }).join('');

  // history
  const groups = {};
  rows.forEach(r => (groups[dayKey(r.occurred_at)] ||= []).push(r));
  const cutoff = dayKey(addDays(new Date(), -(historyDays-1)));
  const keys = Object.keys(groups).filter(k => k >= cutoff).sort().reverse();
  document.getElementById('history').innerHTML = keys.length ? keys.map(k => `
    <div class="day">
      <div class="dayhdr"><span>${fmtDay(k)}</span><span>${byDay[k]} total</span></div>
      ${groups[k].map(r => `
        <div class="ev" data-id="${esc(r.id)}">
          <div class="t">${r.time_unknown ? '—' : fmtTime(r.occurred_at)}</div>
          <div class="m">
            <div class="ty">${esc(r.seizure_type)}${(r.seizure_count||1)>1 ? ` ×${r.seizure_count}` : ''}
              ${r.rescue_med ? '<span class="rx"> · Rescue med</span>' : ''}</div>
            <div class="sub">${[
              r.duration_sec ? fmtDur(r.duration_sec) : '',
              r.recovery ? `<span class="${/right/.test(r.recovery)?'rec-ok':'rec-bad'}">${esc(r.recovery)}</span>` : '',
              r.logged_by ? 'by ' + esc(r.logged_by) : ''
            ].filter(Boolean).join(' · ')}</div>
            ${r.notes ? `<div class="sub">${esc(r.notes)}</div>` : ''}
            ${r._pending ? '<div class="x">Saved on this phone — will sync when online</div>' : ''}
          </div>
        </div>`).join('')}
    </div>`).join('') : '<div class="empty">No seizures logged in this period.</div>';
  document.getElementById('moreBtn').classList.toggle('hidden', historyDays >= HISTORY_DAYS_LOADED);

  // sync state
  const st = document.getElementById('syncState');
  if(outbox.length){ st.textContent = `${outbox.length} waiting to sync`; st.className = 'sync pending'; }
  else if(lastSync){ st.textContent = 'Synced ' + fmtTime(lastSync); st.className = 'sync'; }
  else { st.textContent = navigator.onLine ? 'Connecting…' : 'Offline'; st.className = 'sync'; }
}

/* =========================================================
   Entry sheet
   ========================================================= */
let shRec = null;
function setRec(r){
  shRec = r || null;
  document.querySelectorAll('#recChips button').forEach(b => b.classList.toggle('on', b.dataset.r === shRec));
}
function markDur(){
  const v = document.getElementById('shDur').value;
  document.querySelectorAll('#durChips button').forEach(b => b.classList.toggle('on', b.dataset.s === v));
}
let editing = null;   // row being edited, or null for new
let shType = SEIZURE_TYPES[0];
function setShType(t){
  shType = t;
  document.querySelectorAll('#shTypes button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
}
function openSheet(row, presetType){
  editing = row || null;
  document.getElementById('shTitle').textContent = row ? 'Edit entry' : 'Log seizure';
  setShType(row ? row.seizure_type : (presetType || SEIZURE_TYPES[0]));
  document.getElementById('shWhen').value  = localInputValue(row ? row.occurred_at : new Date());
  document.getElementById('shCount').value = row ? (row.seizure_count||1) : 1;
  document.getElementById('shDur').value   = row && row.duration_sec != null ? row.duration_sec : '';
  setRec(row ? row.recovery : null);
  markDur();
  document.getElementById('shRx').checked  = row ? !!row.rescue_med : false;
  document.getElementById('shNotes').value = row ? (row.notes||'') : '';
  document.getElementById('shDelRow').classList.toggle('hidden', !row);
  document.getElementById('shErr').textContent = '';
  document.getElementById('sheet').classList.add('open');
  document.getElementById('scrim').classList.add('open');
}
function closeSheet(){
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('scrim').classList.remove('open');
  editing = null;
}
function readSheet(){
  const when = document.getElementById('shWhen').value;
  const d = when ? new Date(when) : new Date();
  if(isNaN(d)) throw new Error('Check the date/time.');
  const cnt = Math.max(1, Math.min(500, parseInt(document.getElementById('shCount').value,10) || 1));
  const durRaw = document.getElementById('shDur').value.trim();
  const dur = durRaw === '' ? null : Math.max(0, parseInt(durRaw,10) || 0);
  return {
    occurred_at: d.toISOString(),
    seizure_type: shType,
    seizure_count: cnt,
    duration_sec: dur,
    rescue_med: document.getElementById('shRx').checked,
    recovery: shRec,
    notes: document.getElementById('shNotes').value.trim() || null
  };
}
async function saveSheet(){
  const err = document.getElementById('shErr'); err.textContent = '';
  let data; try{ data = readSheet(); }catch(e){ err.textContent = e.message; return; }
  const btn = document.getElementById('shSave'); btn.disabled = true;
  try{
    if(editing && !editing._pending){
      await api(`seizures?id=eq.${editing.id}`, {
        method:'PATCH', body:{...data, updated_at:new Date().toISOString()}, prefer:'return=minimal'
      });
      closeSheet(); toast('Updated'); await sync();
    }else{
      // new entry (or editing one still waiting to sync): save locally first so nothing is lost
      const row = editing && editing._pending
        ? {...outbox.find(o => o.id === editing.id), ...data}
        : {id:uuid(), ...data, logged_by: myName || null};
      outbox = outbox.filter(o => o.id !== row.id).concat([row]);
      LS.set('sl_outbox', outbox);
      closeSheet(); render(); toast('Logged');
      sync();
    }
  }catch(e){
    err.textContent = navigator.onLine ? e.message : 'No connection — try again when online.';
  }finally{ btn.disabled = false; }
}
async function deleteEntry(){
  if(!editing) return;
  if(!confirm('Delete this entry? This removes it from both phones.')) return;
  try{
    if(editing._pending){
      outbox = outbox.filter(o => o.id !== editing.id); LS.set('sl_outbox', outbox);
    }else{
      await api(`seizures?id=eq.${editing.id}`, {method:'DELETE', prefer:'return=minimal'});
      events = events.filter(e => e.id !== editing.id); LS.set('sl_cache', events);
    }
    closeSheet(); render(); toast('Deleted'); sync();
  }catch(e){
    document.getElementById('shErr').textContent = navigator.onLine ? e.message : 'No connection — try again when online.';
  }
}

/* =========================================================
   CSV export (for neurologist visits)
   ========================================================= */
async function exportCSV(){
  let rows;
  try{ rows = await api('seizures?select=*&order=occurred_at.asc&limit=100000'); }
  catch(e){ rows = allRows().slice().reverse(); toast('Offline — exporting what is on this phone'); }
  const head = ['Date','Time','Type','Count','Duration (sec)','Rescue med','Recovery','Notes','Logged by'];
  const q = v => { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; };
  const lines = [head.join(',')].concat(rows.map(r => [
    dayKey(r.occurred_at), r.time_unknown ? '' : fmtTime(r.occurred_at), r.seizure_type, r.seizure_count||1,
    r.duration_sec ?? '', r.rescue_med ? 'Yes' : 'No', r.recovery || '', r.notes || '', r.logged_by || ''
  ].map(q).join(',')));
  const name = `seizure-log-${dayKey(new Date())}.csv`;
  const blob = new Blob([lines.join('\n')], {type:'text/csv'});
  const file = new File([blob], name, {type:'text/csv'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:name}); return; }catch(e){ if(e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* =========================================================
   Login / UI wiring
   ========================================================= */
function toast(msg){
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1800);
}
function showView(){
  document.getElementById('loginView').classList.toggle('hidden', !!session);
  document.getElementById('mainView').classList.toggle('hidden', !session);
  if(session){
    document.getElementById('whoName').textContent = myName || session.email;
    render(); sync();
  }
}
async function signIn(){
  const email = document.getElementById('liEmail').value.trim();
  const pass  = document.getElementById('liPass').value;
  const name  = document.getElementById('liName').value.trim();
  const err = document.getElementById('liErr'); err.textContent = '';
  if(!email || !pass){ err.textContent = 'Enter email and password.'; return; }
  try{
    session = await authReq('password', {email, password:pass});
    LS.set('sl_session', session);
    myName = name || email.split('@')[0]; LS.set('sl_name', myName);
    showView();
  }catch(e){ err.textContent = e.message; }
}
function signOut(){
  if(outbox.length && !confirm(`${outbox.length} entr${outbox.length>1?'ies have':'y has'} not synced yet and will be lost. Sign out anyway?`)) return;
  session = null; events = []; outbox = []; meds = [];
  ['sl_session','sl_cache','sl_outbox','sl_meds'].forEach(LS.del);
  showView();
}

/* =========================================================
   Medications
   ========================================================= */
function parseDay(s){ if(!s) return null; const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function fmtDate(s){ const d = typeof s === 'string' ? parseDay(s) : s; return d ? d.toLocaleDateString([], {month:'short', day:'numeric', year:'numeric'}) : ''; }
function todayStr(){ return dayKey(new Date()); }
function activeMeds(onDay){   // onDay = 'YYYY-MM-DD'
  return meds.filter(m => m.started_on <= onDay && (!m.ended_on || m.ended_on > onDay))
             .sort((a,b) => a.name.localeCompare(b.name));
}
function medLine(m){ return `${m.name} ${m.dose}${m.frequency ? ', ' + m.frequency : ''}`; }
function renderMeds(){
  const cur = activeMeds(todayStr());
  document.getElementById('medList').innerHTML = cur.length ? cur.map(m => `
    <div class="med">
      <div>
        <div class="nm">${esc(m.name)}</div>
        <div><span class="ds">${esc(m.dose)}</span>${m.frequency ? ' · ' + esc(m.frequency) : ''}</div>
        <div class="since">Since ${fmtDate(m.started_on)}</div>
      </div>
      <div class="btns">
        <button data-act="change" data-id="${m.id}">Change dose</button>
        <button data-act="stop" data-id="${m.id}">Stop</button>
      </div>
    </div>`).join('') : '<div class="empty">No medications entered yet.</div>';
}

let mdMode = null, mdRow = null;
function openSheetEl(id){ document.getElementById(id).classList.add('open'); document.getElementById('scrim').classList.add('open'); }
function closeAllSheets(){
  ['sheet','medSheet','mhSheet'].forEach(i => document.getElementById(i).classList.remove('open'));
  document.getElementById('scrim').classList.remove('open');
  editing = null;
}
function markFreq(){
  const v = document.getElementById('mdFreq').value;
  document.querySelectorAll('#mdFreqChips button').forEach(b => b.classList.toggle('on', b.dataset.f === v));
}
function openMedSheet(mode, row){
  mdMode = mode; mdRow = row || null;
  const $ = id => document.getElementById(id);
  $('mdErr').textContent = '';
  const titles = {add:'Add medication', change:'Change dose', stop:'Stop medication', edit:'Edit record'};
  $('mdTitle').textContent = titles[mode] + (row && mode !== 'edit' ? ' — ' + row.name : '');
  $('mdNameWrap').classList.toggle('hidden', mode === 'change' || mode === 'stop');
  $('mdDoseWrap').classList.toggle('hidden', mode === 'stop');
  $('mdEndWrap').classList.toggle('hidden', mode !== 'edit');
  $('mdDelRow').classList.toggle('hidden', mode !== 'edit');
  $('mdDateLbl').textContent = mode === 'change' ? 'Date of change' : mode === 'stop' ? 'Date stopped' : 'Date started';
  $('mdReasonLbl').textContent = mode === 'stop' ? 'Reason stopped (optional)' : mode === 'change' ? "Reason / doctor's note (optional)" : 'Note (optional)';
  $('mdName').value = row ? row.name : '';
  $('mdDose').value = mode === 'change' ? '' : (row ? row.dose : '');
  $('mdDose').placeholder = mode === 'change' ? `New dose (was ${row.dose})` : 'e.g. 10 mg';
  $('mdFreq').value = row ? (row.frequency || '') : '';
  $('mdDate').value = mode === 'edit' ? row.started_on : todayStr();
  $('mdEnd').value  = mode === 'edit' ? (row.ended_on || '') : '';
  $('mdReason').value = mode === 'edit' ? (row.change_reason || row.end_reason || '') : '';
  markFreq();
  document.getElementById('mhSheet').classList.remove('open');
  openSheetEl('medSheet');
}
async function saveMed(){
  const $ = id => document.getElementById(id);
  const err = $('mdErr'); err.textContent = '';
  const name = $('mdName').value.trim(), dose = $('mdDose').value.trim(), freq = $('mdFreq').value.trim() || null;
  const date = $('mdDate').value, reason = $('mdReason').value.trim() || null;
  if(!date){ err.textContent = 'Pick a date.'; return; }
  const btn = $('mdSave'); btn.disabled = true;
  try{
    if(mdMode === 'add'){
      if(!name || !dose){ throw new Error('Enter the medication name and dose.'); }
      await api('medications', {method:'POST', prefer:'return=minimal',
        body:{name, dose, frequency:freq, started_on:date, change_reason:reason, logged_by:myName||null}});
    }else if(mdMode === 'change'){
      if(!dose) throw new Error('Enter the new dose.');
      if(date < mdRow.started_on) throw new Error('Change date is before this dose started (' + fmtDate(mdRow.started_on) + ').');
      // end the old regimen, start the new one on the same date
      await api(`medications?id=eq.${mdRow.id}`, {method:'PATCH', prefer:'return=minimal', body:{ended_on:date}});
      await api('medications', {method:'POST', prefer:'return=minimal',
        body:{name:mdRow.name, dose, frequency:freq, started_on:date, change_reason:reason, logged_by:myName||null}});
    }else if(mdMode === 'stop'){
      if(date < mdRow.started_on) throw new Error('Stop date is before this dose started.');
      await api(`medications?id=eq.${mdRow.id}`, {method:'PATCH', prefer:'return=minimal', body:{ended_on:date, end_reason:reason}});
    }else if(mdMode === 'edit'){
      const end = $('mdEnd').value || null;
      if(!name || !dose) throw new Error('Name and dose are required.');
      if(end && end < date) throw new Error('Stop date is before start date.');
      const body = {name, dose, frequency:freq, started_on:date, ended_on:end};
      if(mdRow.end_reason && end) body.end_reason = reason; else body.change_reason = reason;
      await api(`medications?id=eq.${mdRow.id}`, {method:'PATCH', prefer:'return=minimal', body});
    }
    closeAllSheets(); toast('Saved'); await sync();
  }catch(e){
    err.textContent = navigator.onLine ? e.message : 'No connection — medication changes need internet.';
  }finally{ btn.disabled = false; }
}
async function deleteMed(){
  if(!mdRow || !confirm(`Delete this record (${medLine(mdRow)})? This can't be undone.`)) return;
  try{
    await api(`medications?id=eq.${mdRow.id}`, {method:'DELETE', prefer:'return=minimal'});
    closeAllSheets(); toast('Deleted'); await sync();
  }catch(e){ document.getElementById('mdErr').textContent = e.message; }
}
function openMedHistory(){
  const byName = {};
  meds.forEach(m => (byName[m.name] ||= []).push(m));
  const names = Object.keys(byName).sort();
  document.getElementById('mhList').innerHTML = names.length ? names.map(n => `
    <div style="margin-top:12px;font-weight:700">${esc(n)}</div>
    ${byName[n].sort((a,b) => b.started_on.localeCompare(a.started_on)).map(m => `
      <div class="mh-row" data-id="${m.id}">
        <div>${esc(m.dose)}${m.frequency ? ' · ' + esc(m.frequency) : ''}
          ${!m.ended_on ? '<span class="tag on">current</span>' : ''}</div>
        <div class="sub">${fmtDate(m.started_on)} → ${m.ended_on ? fmtDate(m.ended_on) : 'now'}
          ${m.change_reason ? ' · ' + esc(m.change_reason) : ''}${m.end_reason ? ' · Stopped: ' + esc(m.end_reason) : ''}</div>
      </div>`).join('')}`).join('') : '<div class="empty">No medications entered yet.</div>';
  openSheetEl('mhSheet');
}

/* =========================================================
   Doctor report
   ========================================================= */
async function openReport(){
  document.getElementById('mainView').classList.add('hidden');
  document.getElementById('reportView').classList.remove('hidden');
  window.scrollTo(0,0);
  await buildReport();
}
function closeReport(){
  document.getElementById('reportView').classList.add('hidden');
  document.getElementById('mainView').classList.remove('hidden');
}
function daysBetween(a, b){ return Math.round((b - a) / 864e5); }
function startOfWeek(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; }
async function buildReport(){
  const body = document.getElementById('repBody');
  body.innerHTML = '<div style="padding:40px;text-align:center;color:#555">Loading…</div>';
  const rv = document.getElementById('repRange').value;
  const today = new Date(); today.setHours(0,0,0,0);
  let rows;
  try{
    rows = await api('seizures?select=*&order=occurred_at.asc&limit=100000') || [];
    try{ meds = await api('medications?select=*&order=started_on.desc') || meds; LS.set('sl_meds', meds); }catch(e){}
  }catch(e){
    rows = allRows().slice().reverse();
  }
  // include unsynced entries
  const ids = new Set(rows.map(r => r.id));
  outbox.forEach(o => { if(!ids.has(o.id)) rows.push(o); });
  rows.sort((a,b) => new Date(a.occurred_at) - new Date(b.occurred_at));

  let start;
  if(rv === 'all'){
    const firstSz = rows.length ? new Date(rows[0].occurred_at) : today;
    const firstMed = meds.length ? parseDay(meds.map(m => m.started_on).sort()[0]) : today;
    start = new Date(Math.min(firstSz, firstMed)); start.setHours(0,0,0,0);
  }else{
    start = addDays(today, -(+rv - 1));
  }
  const endEx = addDays(today, 1);                 // exclusive end
  const inRange = rows.filter(r => { const d = new Date(r.occurred_at); return d >= start && d < endEx; });
  const nDays = Math.max(1, daysBetween(start, endEx));
  const cnt = r => r.seizure_count || 1;
  const total = inRange.reduce((a,r) => a + cnt(r), 0);
  const byDay = {}; inRange.forEach(r => { const k = dayKey(r.occurred_at); byDay[k] = (byDay[k]||0) + cnt(r); });
  const daysWith = Object.keys(byDay).length;
  const maxDay = Object.entries(byDay).sort((a,b) => b[1]-a[1])[0];
  const durs = inRange.filter(r => r.duration_sec != null).map(r => +r.duration_sec);
  const avgDur = durs.length ? Math.round(durs.reduce((a,b)=>a+b,0)/durs.length) : null;
  const withRec = inRange.filter(r => r.recovery);
  const disor = withRec.filter(r => !/right/.test(r.recovery)).length;
  const rescue = inRange.filter(r => r.rescue_med).length;
  const r1 = v => (Math.round(v*10)/10).toString();
  const nm = CHILD_NAME ? CHILD_NAME + "'s" : '';

  // ---- medication change markers within range
  const startK = dayKey(start), endK = dayKey(today);
  const changes = [];
  meds.forEach(m => {
    if(m.started_on >= startK && m.started_on <= endK){
      const prev = meds.find(p => p.name === m.name && p.ended_on === m.started_on);
      changes.push({date:m.started_on, text: prev ? `${m.name}: ${prev.dose} → ${m.dose}` : `Started ${m.name} ${m.dose}`, reason:m.change_reason});
    }
    if(m.ended_on && m.ended_on >= startK && m.ended_on <= endK){
      const next = meds.find(n => n.name === m.name && n.started_on === m.ended_on);
      if(!next) changes.push({date:m.ended_on, text:`Stopped ${m.name} (${m.dose})`, reason:m.end_reason});
    }
  });
  changes.sort((a,b) => a.date.localeCompare(b.date));

  // ---- chart buckets
  const gran = nDays <= 62 ? 'day' : nDays <= 400 ? 'week' : 'month';
  const buckets = [];
  if(gran === 'day'){ for(let d = new Date(start); d < endEx; d = addDays(d,1)) buckets.push({s:new Date(d), e:addDays(d,1)}); }
  else if(gran === 'week'){ for(let d = startOfWeek(start); d < endEx; d = addDays(d,7)) buckets.push({s:new Date(d), e:addDays(d,7)}); }
  else { for(let d = new Date(start.getFullYear(), start.getMonth(), 1); d < endEx; d = new Date(d.getFullYear(), d.getMonth()+1, 1)) buckets.push({s:new Date(d), e:new Date(d.getFullYear(), d.getMonth()+1, 1)}); }
  buckets.forEach(b => b.v = inRange.filter(r => { const d = new Date(r.occurred_at); return d >= b.s && d < b.e; }).reduce((a,r) => a + cnt(r), 0));
  const W = 760, H = 230, pl = 34, pr = 10, pt = 14, pb = 34;
  const cw = W - pl - pr, ch = H - pt - pb;
  const maxV = Math.max(1, ...buckets.map(b => b.v));
  const niceMax = (() => { const steps = [1,2,5,10,20,25,50,100,200,500]; const step = steps.find(s => maxV/s <= 5) || 1000; return Math.ceil(maxV/step)*step; })();
  const x0 = buckets.length ? buckets[0].s.getTime() : start.getTime();
  const x1 = buckets.length ? buckets[buckets.length-1].e.getTime() : endEx.getTime();
  const X = t => pl + (t - x0) / (x1 - x0) * cw;
  const Y = v => pt + ch - v / niceMax * ch;
  const bw = cw / Math.max(1, buckets.length);
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Seizures per ${gran}">`;
  for(let i=0;i<=4;i++){ const v = niceMax*i/4, y = Y(v);
    svg += `<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#e5e7eb"/><text x="${pl-6}" y="${y+4}" font-size="10" text-anchor="end" fill="#555">${Math.round(v)}</text>`; }
  buckets.forEach((b,i) => { if(!b.v) return; const x = X(b.s.getTime()) + bw*0.12, w = Math.max(1, bw*0.76);
    svg += `<rect x="${x}" y="${Y(b.v)}" width="${w}" height="${pt+ch-Y(b.v)}" fill="#0284c7" rx="1.5"><title>${b.v}</title></rect>`; });
  const lblEvery = Math.ceil(buckets.length / 10);
  buckets.forEach((b,i) => { if(i % lblEvery) return;
    const t = gran === 'month' ? b.s.toLocaleDateString([], {month:'short', year:'2-digit'}) : b.s.toLocaleDateString([], {month:'numeric', day:'numeric'});
    svg += `<text x="${X(b.s.getTime()) + bw/2}" y="${H-pb+14}" font-size="10" text-anchor="middle" fill="#555">${t}</text>`; });
  changes.forEach((c,i) => { const x = X(parseDay(c.date).getTime());
    svg += `<line x1="${x}" x2="${x}" y1="${pt}" y2="${pt+ch}" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/>
            <circle cx="${x}" cy="${pt+8}" r="8" fill="#dc2626"/><text x="${x}" y="${pt+11.5}" font-size="10" font-weight="700" text-anchor="middle" fill="#fff">${i+1}</text>`; });
  svg += `<line x1="${pl}" x2="${W-pr}" y1="${pt+ch}" y2="${pt+ch}" stroke="#111"/></svg>`;

  // ---- seizure rate by medication period
  const bounds = [...new Set([startK, ...changes.map(c => c.date), dayKey(endEx)])].sort();
  const periods = [];
  for(let i=0;i<bounds.length-1;i++){
    const a = parseDay(bounds[i]), b = parseDay(bounds[i+1]);
    const days = daysBetween(a, b); if(days <= 0) continue;
    const rs = inRange.filter(r => { const d = new Date(r.occurred_at); return d >= a && d < b; });
    const n = rs.reduce((x,r) => x + cnt(r), 0);
    const ds = rs.filter(r => r.duration_sec != null).map(r => +r.duration_sec);
    periods.push({a, b:addDays(b,-1), days, n, avg:n/days, dur: ds.length ? Math.round(ds.reduce((x,y)=>x+y,0)/ds.length) : null, regimen: activeMeds(bounds[i])});
  }

  // ---- monthly table
  const months = {};
  inRange.forEach(r => { const d = new Date(r.occurred_at); const k = `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
    const m = months[k] ||= {n:0, durs:[], dis:0, rec:0, resc:0}; m.n += cnt(r);
    if(r.duration_sec != null) m.durs.push(+r.duration_sec); if(r.recovery){ m.rec++; if(!/right/.test(r.recovery)) m.dis++; } if(r.rescue_med) m.resc++; });
  const monthRows = Object.keys(months).sort().reverse().map(k => {
    const [y,mo] = k.split('-').map(Number), m = months[k];
    const first = new Date(y, mo-1, 1), last = new Date(y, mo, 1);
    const ds = Math.max(1, daysBetween(first < start ? start : first, last > endEx ? endEx : last));
    return `<tr><td>${first.toLocaleDateString([], {month:'long', year:'numeric'})}</td><td class="n">${m.n}</td><td class="n">${r1(m.n/ds)}</td>
      <td class="n">${m.durs.length ? fmtDur(Math.round(m.durs.reduce((a,b)=>a+b,0)/m.durs.length)) : '—'}</td>
      <td class="n">${m.rec ? m.dis + ' of ' + m.rec : '—'}</td><td class="n">${m.resc || '—'}</td></tr>`; }).join('');

  // ---- full log (newest first, grouped by day)
  const logGroups = {};
  inRange.slice().reverse().forEach(r => (logGroups[dayKey(r.occurred_at)] ||= []).push(r));
  const logRows = Object.keys(logGroups).map(k => `
    <tr class="daygrp"><td colspan="6">${parseDay(k).toLocaleDateString([], {weekday:'short', month:'short', day:'numeric', year:'numeric'})} — ${byDay[k]} total</td></tr>
    ${logGroups[k].map(r => `<tr><td>${r.time_unknown ? '—' : fmtTime(r.occurred_at)}</td><td>${esc(r.seizure_type)}${cnt(r)>1 ? ' ×'+cnt(r) : ''}</td>
      <td class="n">${r.duration_sec != null ? fmtDur(r.duration_sec) : '—'}</td><td>${esc(r.recovery || '—')}</td>
      <td>${r.rescue_med ? 'Yes' : ''}</td><td>${esc(r.notes || '')}</td></tr>`).join('')}`).join('');

  const cur = activeMeds(endK);
  const histRows = meds.filter(m => m.started_on <= endK && (!m.ended_on || m.ended_on >= startK))
    .sort((a,b) => a.name.localeCompare(b.name) || a.started_on.localeCompare(b.started_on))
    .map(m => `<tr><td>${esc(m.name)}</td><td>${esc(m.dose)}</td><td>${esc(m.frequency || '')}</td><td>${fmtDate(m.started_on)}</td>
      <td>${m.ended_on ? fmtDate(m.ended_on) : '<b>Current</b>'}</td><td>${esc([m.change_reason, m.end_reason ? 'Stopped: ' + m.end_reason : ''].filter(Boolean).join(' · '))}</td></tr>`).join('');

  const rangeLbl = `${start.toLocaleDateString([], {month:'short', day:'numeric', year:'numeric'})} – ${today.toLocaleDateString([], {month:'short', day:'numeric', year:'numeric'})}`;
  body.innerHTML = `
    <h1>${esc(nm)} Seizure &amp; Medication Report</h1>
    <div class="meta">${rangeLbl} (${nDays} days) · Generated ${new Date().toLocaleString([], {month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit'})}</div>

    <h2>Summary</h2>
    <div class="kpis">
      <div class="kpi"><div class="v">${total}</div><div class="l">Total seizures</div></div>
      <div class="kpi"><div class="v">${r1(total/nDays)}</div><div class="l">Avg per day</div></div>
      <div class="kpi"><div class="v">${maxDay ? maxDay[1] : 0}</div><div class="l">Most in one day${maxDay ? ' (' + fmtDate(maxDay[0]) + ')' : ''}</div></div>
      <div class="kpi"><div class="v">${nDays - daysWith}</div><div class="l">Seizure-free days</div></div>
      <div class="kpi"><div class="v">${avgDur != null ? fmtDur(avgDur) : '—'}</div><div class="l">Avg length${durs.length ? ' (' + durs.length + ' timed)' : ''}</div></div>
      <div class="kpi"><div class="v">${durs.length ? fmtDur(Math.max(...durs)) : '—'}</div><div class="l">Longest</div></div>
      <div class="kpi"><div class="v">${withRec.length ? Math.round(disor/withRec.length*100) + '%' : '—'}</div><div class="l">Disoriented after${withRec.length ? ' (' + disor + ' of ' + withRec.length + ')' : ''}</div></div>
      <div class="kpi"><div class="v">${rescue}</div><div class="l">Rescue med given</div></div>
    </div>

    <h2>Current medications</h2>
    ${cur.length ? `<table><tr><th>Medication</th><th>Dose</th><th>Frequency</th><th>Since</th></tr>
      ${cur.map(m => `<tr><td><b>${esc(m.name)}</b></td><td>${esc(m.dose)}</td><td>${esc(m.frequency || '')}</td><td>${fmtDate(m.started_on)}</td></tr>`).join('')}</table>`
      : '<div class="note">No current medications entered.</div>'}

    <h2>Seizures per ${gran}</h2>
    ${svg}
    ${changes.length ? `<table style="margin-top:6px"><tr><th style="width:28px">#</th><th style="width:110px">Date</th><th>Medication change</th></tr>
      ${changes.map((c,i) => `<tr><td><b style="color:#dc2626">${i+1}</b></td><td>${fmtDate(c.date)}</td><td>${esc(c.text)}${c.reason ? ' — ' + esc(c.reason) : ''}</td></tr>`).join('')}</table>`
      : '<div class="note">No medication changes in this period.</div>'}

    ${periods.length > 1 ? `<h2>Seizure rate by medication period</h2>
    <table><tr><th>Period</th><th>Medications during period</th><th class="n">Days</th><th class="n">Seizures</th><th class="n">Avg/day</th><th class="n">Avg length</th></tr>
      ${periods.map(p => `<tr><td>${fmtDate(p.a)} – ${fmtDate(p.b)}</td><td>${p.regimen.length ? p.regimen.map(m => esc(medLine(m))).join('<br>') : '<i>None recorded</i>'}</td>
        <td class="n">${p.days}</td><td class="n">${p.n}</td><td class="n"><b>${r1(p.avg)}</b></td><td class="n">${p.dur != null ? fmtDur(p.dur) : '—'}</td></tr>`).join('')}</table>
    <div class="note">Periods are split at each medication change so the rate on each regimen can be compared.</div>` : ''}

    <h2>Medication history</h2>
    ${histRows ? `<table><tr><th>Medication</th><th>Dose</th><th>Frequency</th><th>Started</th><th>Ended</th><th>Notes</th></tr>${histRows}</table>`
      : '<div class="note">No medication history entered.</div>'}

    <h2>Monthly breakdown</h2>
    ${monthRows ? `<table><tr><th>Month</th><th class="n">Seizures</th><th class="n">Avg/day</th><th class="n">Avg length</th><th class="n">Disoriented</th><th class="n">Rescue</th></tr>${monthRows}</table>`
      : '<div class="note">No seizures recorded in this period.</div>'}

    <h2>Full seizure log</h2>
    ${logRows ? `<table><tr><th style="width:70px">Time</th><th>Type</th><th class="n">Length</th><th>Recovery</th><th>Rescue</th><th>Notes</th></tr>${logRows}</table>`
      : '<div class="note">No seizures recorded in this period.</div>'}
  `;
}

(function init(){
  if(CHILD_NAME){
    const t = `${CHILD_NAME}'s Seizure Log`;
    document.getElementById('title').textContent = t; document.title = t;
    document.getElementById('liTitle').textContent = t;
  }
  document.getElementById('liName').value = myName;
  document.getElementById('typeBtns').innerHTML =
    SEIZURE_TYPES.map((t,i) => `<button data-t="${esc(t)}">${i===0 ? '+ Log ' + esc(t.toLowerCase()) + ' seizure' : esc(t)}</button>`).join('');
  document.getElementById('shTypes').innerHTML =
    SEIZURE_TYPES.map(t => `<button type="button" data-t="${esc(t)}">${esc(t)}</button>`).join('');

  document.getElementById('typeBtns').onclick = e => { const b = e.target.closest('button'); if(b) openSheet(null, b.dataset.t); };
  document.getElementById('shTypes').onclick  = e => { const b = e.target.closest('button'); if(b) setShType(b.dataset.t); };
  document.getElementById('history').onclick  = e => {
    const el = e.target.closest('.ev'); if(!el) return;
    const row = allRows().find(r => r.id === el.dataset.id); if(row) openSheet(row);
  };
  document.querySelectorAll('.rangebtns button').forEach(b => b.onclick = () => {
    range = +b.dataset.range;
    document.querySelectorAll('.rangebtns button').forEach(x => x.classList.toggle('on', x === b));
    render();
  });
  const cnt = document.getElementById('shCount');
  document.getElementById('cMinus').onclick = () => cnt.value = Math.max(1, (+cnt.value||1) - 1);
  document.getElementById('cPlus').onclick  = () => cnt.value = Math.min(500, (+cnt.value||1) + 1);
  document.getElementById('durChips').onclick = e => { const b = e.target.closest('button'); if(!b) return;
    document.getElementById('shDur').value = b.dataset.s; markDur(); };
  document.getElementById('shDur').oninput = markDur;
  document.getElementById('recChips').onclick = e => { const b = e.target.closest('button'); if(b) setRec(shRec === b.dataset.r ? null : b.dataset.r); };
  document.getElementById('shSave').onclick   = saveSheet;
  document.getElementById('shCancel').onclick = closeSheet;
  document.getElementById('scrim').onclick    = closeAllSheets;
  document.getElementById('medList').onclick  = e => { const b = e.target.closest('button'); if(!b) return;
    const m = meds.find(x => x.id === b.dataset.id); if(m) openMedSheet(b.dataset.act, m); };
  document.getElementById('addMedBtn').onclick  = () => openMedSheet('add');
  document.getElementById('medHistBtn').onclick = openMedHistory;
  document.getElementById('mhList').onclick = e => { const el = e.target.closest('.mh-row'); if(!el) return;
    const m = meds.find(x => x.id === el.dataset.id); if(m) openMedSheet('edit', m); };
  document.getElementById('mhClose').onclick  = closeAllSheets;
  document.getElementById('mdCancel').onclick = closeAllSheets;
  document.getElementById('mdSave').onclick   = saveMed;
  document.getElementById('mdDelete').onclick = deleteMed;
  document.getElementById('mdFreqChips').onclick = e => { const b = e.target.closest('button'); if(!b) return;
    document.getElementById('mdFreq').value = b.dataset.f; markFreq(); };
  document.getElementById('mdFreq').oninput = markFreq;
  document.getElementById('reportBtn').onclick = openReport;
  document.getElementById('repBack').onclick   = closeReport;
  document.getElementById('repRange').onchange = buildReport;
  document.getElementById('repPrint').onclick  = () => window.print();
  document.getElementById('shDelete').onclick = deleteEntry;
  document.getElementById('moreBtn').onclick  = () => { historyDays = Math.min(HISTORY_DAYS_LOADED, historyDays + 14); render(); };
  document.getElementById('exportBtn').onclick = exportCSV;
  document.getElementById('logoutBtn').onclick = signOut;
  document.getElementById('liBtn').onclick = signIn;
  document.getElementById('liPass').addEventListener('keydown', e => { if(e.key === 'Enter') signIn(); });

  window.addEventListener('online', sync);
  document.addEventListener('visibilitychange', () => { if(!document.hidden) sync(); });
  setInterval(() => { if(!document.hidden) sync(); }, POLL_MS);
  // re-render at midnight so "Today" rolls over
  setInterval(render, 60000);

  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  showView();
})();
</script>
</body>
</html>
